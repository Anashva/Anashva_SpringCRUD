<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Management</h1>
            <p>Manage student records with the Spring Boot backend.</p>
        </header>

        <section class="form-section">
            <h2 id="form-title">Create a New Student</h2>
            <form id="student-form">
                <input type="hidden" id="student-id" />
                <label>
                    Name
                    <input type="text" id="student-name" required />
                </label>
                <label>
                    Email
                    <input type="email" id="student-email" required />
                </label>
                <label>
                    Course
                    <input type="text" id="student-course" required />
                </label>
                <div class="form-actions">
                    <button type="submit" id="submit-button">Save Student</button>
                    <button type="button" id="cancel-button" class="secondary">Cancel</button>
                </div>
            </form>
            <div id="form-message" class="message"></div>
        </section>

        <section class="table-section">
            <div class="table-header">
                <h2>Student List</h2>
                <button id="refresh-button" class="secondary">Refresh</button>
            </div>
            <div id="table-message" class="message"></div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="student-table-body"></tbody>
            </table>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
